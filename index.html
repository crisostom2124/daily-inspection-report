<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1764A8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inspection">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Daily Inspection Report</title>
<style>
:root{
  --ink:#14202b; --ink-2:#4a5a66; --paper:#eef1ef; --card:#ffffff; --line:#c5cecb;
  --blue:#1764a8; --blue-d:#0f4c84; --hivis:#f5c400; --green:#1f7a4d; --red:#b3261e;
  --r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.4 "Avenir Next","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.banner{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0))}
.banner img{display:block;width:100%;max-width:640px;margin:0 auto;height:auto}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
.titlebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 14px}
h1{margin:0;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
h2{margin:26px 0 10px;font-size:18px;font-weight:800}
h3{margin:0;font-size:16px;font-weight:800}
.link{background:none;border:0;color:var(--blue);font:inherit;font-weight:700;padding:10px 0 10px 10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.fld{display:block;margin:12px 0 0;font-weight:700;font-size:14px;color:var(--ink-2)}
.fld:first-child{margin-top:0}
input[type=text],input[type=date],textarea{
  display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;font-weight:500;color:var(--ink);
  background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:12px;min-height:48px}
textarea{resize:vertical;line-height:1.35}
input:focus-visible,textarea:focus-visible,button:focus-visible,.shot:focus-within,.gal:focus-within,a:focus-visible{
  outline:3px solid var(--blue);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

.finding{margin-bottom:14px}
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.fhead .chip{margin-left:auto}
.chip{font-size:12.5px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap}
.chip.todo{background:#e3e8e6;color:var(--ink)}
.chip.open{background:var(--hivis);color:#2a2200}
.chip.done{background:var(--green);color:#fff}
.del{background:none;border:0;padding:8px;margin:-8px -8px -8px 0;color:var(--ink-2);cursor:pointer;border-radius:8px}
.del:hover{color:var(--red)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{min-width:0}
.shot{position:relative;display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:3/4;
  border:2px dashed var(--line);border-radius:8px;background:#f6f8f7;overflow:hidden;cursor:pointer;text-align:center}
.shot.has{border-style:solid;border-color:var(--ink);background:#10171d}
.shot img{width:100%;height:100%;object-fit:contain;display:block}
.shot .ph{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;color:var(--ink-2)}
.shot .ph b{font-size:17px;color:var(--ink)}
.shot .ph small{font-size:12.5px}
.shot .tag{position:absolute;left:6px;top:6px;background:rgba(10,18,26,.78);color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px}
.shot.busy::after{content:"Processing photo";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.88);font-weight:800}
.gal{display:block;margin-top:6px;text-align:center;color:var(--blue);font-weight:700;font-size:14px;padding:8px 4px;cursor:pointer}
.add{display:block;width:100%;min-height:54px;border:2px dashed var(--blue);background:transparent;color:var(--blue);
  font:inherit;font-weight:800;border-radius:var(--r);cursor:pointer}
.sigwrap{position:relative}
#sig{display:block;width:100%;height:170px;background:#fff;border:1.5px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.sighint{position:absolute;left:14px;bottom:12px;right:14px;pointer-events:none;color:#9aa8a3;font-size:14px;
  border-top:1.5px solid #dfe5e2;padding-top:6px}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:var(--r);
  border:2px solid var(--blue);font:inherit;font-weight:800;font-size:17px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:active{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue)}
.btn[disabled]{opacity:.6;cursor:progress}
.stack{display:grid;gap:10px}
#msg{margin:12px 0 0;padding:12px 14px;border-radius:var(--r);background:#fdecea;border:1.5px solid var(--red);color:#5c110c;font-weight:600}
#msg ul{margin:6px 0 0;padding-left:20px}
#msg[hidden],#done[hidden],#old[hidden]{display:none}
#done{margin-top:14px;padding:14px;border-radius:var(--r);background:#e7f4ec;border:1.5px solid var(--green)}
#done p{margin:0 0 12px;font-weight:700}
#old{margin:0 0 14px;padding:12px 14px;border-radius:var(--r);background:#fff6d1;border:1.5px solid var(--hivis);font-weight:600}
#old button{margin-top:8px}
.fine{color:var(--ink-2);font-size:13.5px;margin:8px 2px 0}
</style>
</head>
<body>
<div class="banner"><img id="hdrImg" alt="Jangho Curtain Wall Singapore Pte. Ltd."></div>
<main>
  <div class="titlebar">
    <h1>Daily inspection report</h1>
    <button class="link" id="newReport" type="button">New report</button>
  </div>

  <div id="old" hidden>
    <span id="oldTxt"></span><br>
    <button class="btn ghost" id="oldNew" type="button" style="min-height:44px;font-size:15px">Start today's report</button>
  </div>

  <section class="card" aria-labelledby="h-details">
    <h3 id="h-details" class="sr">Report details</h3>
    <div class="row2">
      <label class="fld">Inspected by
        <input type="text" id="name" autocomplete="name" placeholder="Your full name"></label>
      <label class="fld">Date
        <input type="date" id="date"></label>
    </div>
  </section>

  <h2>Findings</h2>
  <div id="list"></div>
  <button class="add" id="add" type="button">Add finding</button>

  <h2>Sign and send</h2>
  <section class="card">
    <div class="fld" style="margin-top:0">Signature of inspector</div>
    <div class="sigwrap">
      <canvas id="sig" aria-label="Signature box"></canvas>
      <div class="sighint" id="sigHint">Sign here with your finger</div>
    </div>
    <div class="sigbar"><span class="fine" style="margin:0">Sign fresh for each report.</span>
      <button class="link" id="sigClear" type="button">Clear signature</button></div>
  </section>

  <div id="msg" role="alert" hidden></div>

  <div class="stack" style="margin-top:14px">
    <button class="btn primary" id="make" type="button">Create PDF</button>
  </div>

  <div id="done" hidden>
    <p id="doneTxt"></p>
    <div class="stack">
      <button class="btn primary" id="share" type="button" hidden>Share to WhatsApp</button>
      <button class="btn ghost" id="dl" type="button">Download PDF</button>
      <a class="btn ghost" id="view" target="_blank" rel="noopener">Preview PDF</a>
    </div>
    <p class="fine" style="margin-top:10px">Share opens your phone's share sheet. Pick WhatsApp, then the group.</p>
  </div>
</main>

<script src="jspdf.umd.min.js"></script>

/* ---------- draft storage (IndexedDB) ---------- */
const idb = () => new Promise((res,rej)=>{
  const r=indexedDB.open('dir-app',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
});
const idbGet = async k => { const d=await idb(); return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);}); };
const idbSet = async (k,v) => { const d=await idb(); return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error);}); };
let saveT; const scheduleSave = () => { clearTimeout(saveT); saveT=setTimeout(()=>idbSet('draft',state).catch(()=>{}),350); };

/* ---------- photos ---------- */
async function compress(file,max=1400,q=0.78){
  let src,w,h;
  try{ src=await createImageBitmap(file,{imageOrientation:'from-image'}); w=src.width; h=src.height; }
  catch(_){
    src=await new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file);});
    w=src.naturalWidth; h=src.naturalHeight;
  }
  const s=Math.min(1,max/Math.max(w,h)), cw=Math.round(w*s), ch=Math.round(h*s);
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cw,ch); x.drawImage(src,0,0,cw,ch);
  if(src.close) src.close();
  return {url:c.toDataURL('image/jpeg',q), w:cw, h:ch};
}

function statusOf(f){
  if(!f.before) return ['Before photo needed','todo'];
  if(!f.after) return ['Open: after photo needed','open'];
  if(!f.breach.trim()) return ['Describe the breach','todo'];
  return ['Complete','done'];
}
function slotHTML(f,k,label){
  const p=f[k];
  return `<div class="slot">
    <label class="shot ${p?'has':''}">
      <input class="sr" type="file" accept="image/*" capture="environment" data-k="${k}">
      ${p?`<img src="${p.url}" alt="${label} photo"><span class="tag">${label}</span>`
         :`<span class="ph">${camSVG}<b>${label}</b><small>Tap to take photo</small></span>`}
    </label>
    <label class="gal">From gallery<input class="sr" type="file" accept="image/*" data-k="${k}"></label>
  </div>`;
}
function cardHTML(f,i){
  const [txt,cls]=statusOf(f);
  return `<article class="card finding" data-id="${f.id}">
    <div class="fhead"><h3>Finding ${i+1}</h3><span class="chip ${cls}">${txt}</span>
      <button class="del" type="button" data-act="del" aria-label="Delete finding ${i+1}">${binSVG}</button></div>
    <div class="pair">${slotHTML(f,'before','Before')}${slotHTML(f,'after','After')}</div>
    <label class="fld">Safety breach (printed under the Before photo)
      <textarea rows="2" data-k="breach" placeholder="e.g. Scaffold pipes left in the walkway">${esc(f.breach)}</textarea></label>
    <label class="fld">Action taken (printed under the After photo)
      <textarea rows="2" data-k="fix" placeholder="e.g. Pipes removed and stacked at the storage area">${esc(f.fix)}</textarea></label>
  </article>`;
}
const list=$('#list');
const find = id => state.findings.find(f=>f.id===id);
function renderList(){ list.innerHTML=state.findings.map(cardHTML).join(''); }
function updateChip(card){
  const f=find(card.dataset.id); const [t,c]=statusOf(f);
  const chip=card.querySelector('.chip'); chip.textContent=t; chip.className='chip '+c;
}

list.addEventListener('change', async e=>{
  const inp=e.target.closest('input[type=file]'); if(!inp) return;
  const file=inp.files[0]; if(!file) return;
  const card=inp.closest('.finding'), f=find(card.dataset.id), k=inp.dataset.k;
  inp.closest('.slot').querySelector('.shot').classList.add('busy');
  try{ f[k]=await compress(file); clearMsg(); }
  catch(_){ showMsg(['Could not read that photo. Please try again.']); }
  renderList(); scheduleSave();
});
list.addEventListener('input', e=>{
  const ta=e.target.closest('textarea'); if(!ta) return;
  const card=ta.closest('.finding'); find(card.dataset.id)[ta.dataset.k]=ta.value;
  updateChip(card); scheduleSave();
});
list.addEventListener('click', e=>{
  const b=e.target.closest('[data-act=del]'); if(!b) return;

});

/* ---------- signature ---------- */
const cv=$('#sig'), ctx=cv.getContext('2d');
let lastW=0;
function sizeSig(){
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  const dpr=Math.max(1,window.devicePixelRatio||1);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0b1a2a';
  lastW=r.width;
  if(state.sig){ const img=new Image(); img.onload=()=>{ctx.drawImage(img,0,0,r.width,r.height); hint();}; img.src=state.sig; }
  hint();
}
function hint(){ $('#sigHint').style.display = state.sig ? 'none' : ''; }
const pt = e => { const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
let drawing=false,last=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId); drawing=true; last=pt(e);
  ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(last.x+.01,last.y); ctx.stroke();
  $('#sigHint').style.display='none'; e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(!drawing) return; const p=pt(e);
  ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; e.preventDefault();
});
const endStroke=()=>{ if(!drawing) return; drawing=false; state.sig=cv.toDataURL('image/png'); scheduleSave(); };
cv.addEventListener('pointerup',endStroke); cv.addEventListener('pointercancel',endStroke);
$('#sigClear').addEventListener('click',()=>{
  ctx.clearRect(0,0,cv.width,cv.height); state.sig=null; hint(); scheduleSave();
});
window.addEventListener('resize',()=>{ const w=cv.getBoundingClientRect().width; if(Math.abs(w-lastW)>2) sizeSig(); });
function sigCrop(){
  const w=cv.width,h=cv.height; if(!w||!h) return null;
  const d=ctx.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++){ for(let x=0;x<w;x++){ if(d[(y*w+x)*4+3]>16){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } } }
  if(x1<0) return null;
  const p=8; x0=Math.max(0,x0-p); y0=Math.max(0,y0-p); x1=Math.min(w-1,x1+p); y1=Math.min(h-1,y1+p);
  const c=document.createElement('canvas'); c.width=x1-x0+1; c.height=y1-y0+1;
  c.getContext('2d').drawImage(cv,x0,y0,c.width,c.height,0,0,c.width,c.height);
  return {url:c.toDataURL('image/png'), w:c.width, h:c.height};
}

/* ---------- messages ---------- */
const msg=$('#msg');
function showMsg(lines){ msg.innerHTML = lines.length>1 ? 'Fix these before creating the PDF:<ul>'+lines.map(l=>`<li>${esc(l)}</li>`).join('')+'</ul>' : esc(lines[0]); msg.hidden=false; }
function clearMsg(){ msg.hidden=true; msg.innerHTML=''; }

/* ---------- validate + PDF ---------- */
function validate(){
  const p=[];
  if(!state.name.trim()) p.push({m:'Enter the inspector name.', el:nameEl});
  if(!state.findings.length) p.push({m:'Add at least one finding.', el:$('#add')});
  state.findings.forEach((f,i)=>{
    const n=i+1, card=()=>list.querySelector(`[data-id="${f.id}"]`);
    if(!f.before) p.push({m:`Finding ${n}: take the Before photo.`, el:card});
    if(!f.after)  p.push({m:`Finding ${n}: add the After photo once it is rectified.`, el:card});
    if(!f.breach.trim()) p.push({m:`Finding ${n}: describe the safety breach.`, el:card});
  });
  if(!sigCrop()) p.push({m:'Sign in the signature box.', el:cv});
  return p;
}

function buildPDF(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4',compress:true});
  const PW=210,PH=297,M=12.7,CW=PW-2*M,COLW=CW/2,PAD=1.6;
  const HH=CW*HDR.h/HDR.w, HY=7.5, TOP=HY+HH+5;
  const header=()=>doc.addImage(HDR.url,'PNG',M,HY,CW,HH);
  header();
  doc.setFont('times','normal'); doc.setTextColor(0,0,0);
  doc.setFontSize(18); doc.text('DAILY INSPECTION REPORT',PW/2,TOP+8,{align:'center'});
  doc.setFontSize(16); doc.text(`(${fmtDate(state.date)})`,PW/2,TOP+18,{align:'center'});
  let y=TOP+26;
  doc.setDrawColor(0,0,0); doc.setLineWidth(0.25);

  const FS=10.5, LHF=1.25, LH=FS*LHF*0.3528, bw=COLW-2*PAD, MAXH=62, MAXL=8;
  const fit=(p)=>{ const s=Math.min(bw/p.w,MAXH/p.h); return {w:p.w*s,h:p.h*s}; };
  const wrap=t=>{ let l=doc.splitTextToSize((t||'').trim(),bw); if(l.length>MAXL){ l=l.slice(0,MAXL); l[MAXL-1]=l[MAXL-1].replace(/.{0,2}$/,'...'); } return l; };

  for(const f of state.findings){
    doc.setFontSize(FS);
    const a=fit(f.before), b=fit(f.after), boxH=Math.max(a.h,b.h);
    const l1=wrap(f.breach), l2=wrap(f.fix);
    const nl=Math.max(l1.length,l2.length,1);
    const rowH=PAD+boxH+2+nl*LH+PAD;
    if(y+rowH>PH-M){ doc.addPage(); header(); y=TOP; }
    doc.rect(M,y,COLW,rowH); doc.rect(M+COLW,y,COLW,rowH);
    doc.addImage(f.before.url,'JPEG',M+PAD+(bw-a.w)/2,y+PAD,a.w,a.h);
    doc.addImage(f.after.url,'JPEG',M+COLW+PAD+(bw-b.w)/2,y+PAD,b.w,b.h);
    doc.setFont('times','normal'); doc.setFontSize(FS);
    doc.text(l1,M+PAD,y+PAD+boxH+2,{baseline:'top',lineHeightFactor:LHF});
    if(l2.length) doc.text(l2,M+COLW+PAD,y+PAD+boxH+2,{baseline:'top',lineHeightFactor:LHF});
    y+=rowH;
  }

  y+=8;
  const sigH=34, dateH=14;
  if(y+sigH+dateH>PH-M){ doc.addPage(); header(); y=TOP; }
  doc.rect(M,y,COLW,sigH); doc.rect(M+COLW,y,COLW,sigH);
  doc.rect(M,y+sigH,COLW,dateH); doc.rect(M+COLW,y+sigH,COLW,dateH);
  doc.setFont('times','normal'); doc.setFontSize(11);
  doc.text('INSPECTED BY:',M+PAD+1,y+4,{baseline:'top'});
  doc.text(state.name.trim(),M+COLW+PAD+1,y+4,{baseline:'top'});
  const sg=sigCrop();
  if(sg){
    const mw=COLW-2*PAD-2, mh=sigH-13, s=Math.min(mw/sg.w,mh/sg.h);
    doc.addImage(sg.url,'PNG',M+COLW+PAD+1,y+11,sg.w*s,sg.h*s);
  }
  doc.text('DATE:',M+PAD+1,y+sigH+4,{baseline:'top'});
  doc.text(fmtDate(state.date),M+COLW+PAD+1,y+sigH+4,{baseline:'top'});

  const safe=(state.name.trim().replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'Inspector');
  const fileName=`Daily_Inspection_Report_${state.date}_${safe}.pdf`;
  const blob=doc.output('blob');
  return {blob, fileName, pages:doc.getNumberOfPages()};
}

$('#make').addEventListener('click',async()=>{
  const btn=$('#make'); clearMsg(); $('#done').hidden=true;
  const problems=validate();
  if(problems.length){
    showMsg(problems.map(p=>p.m));
    const el=typeof problems[0].el==='function'?problems[0].el():problems[0].el;
    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  btn.disabled=true; btn.textContent='Creating PDF...';
  await new Promise(r=>setTimeout(r,30));
  try{
    const out=buildPDF();
    if(pdfOut) URL.revokeObjectURL(pdfOut.url);
    const file=new File([out.blob],out.fileName,{type:'application/pdf'});
    pdfOut={...out,file,url:URL.createObjectURL(out.blob)};
    const mb=(out.blob.size/1048576).toFixed(1);
    $('#doneTxt').textContent=`PDF ready: ${state.findings.length} finding${state.findings.length>1?'s':''}, ${out.pages} page${out.pages>1?'s':''}, ${mb} MB.`;
    $('#view').href=pdfOut.url;
    $('#share').hidden=!(navigator.canShare && navigator.canShare({files:[file]}));
    $('#done').hidden=false;
    $('#done').scrollIntoView({behavior:'smooth',block:'center'});
  }catch(err){
    console.error(err); showMsg(['Could not create the PDF. Please try again.']);
  }finally{ btn.disabled=false; btn.textContent='Create PDF'; }
});
$('#share').addEventListener('click',async()=>{
  if(!pdfOut) return;
  try{ await navigator.share({files:[pdfOut.file], title:'Daily Inspection Report '+fmtDate(state.date)}); }
  catch(e){ if(e.name!=='AbortError') showMsg(['Sharing did not work. Tap Download PDF, then send the file in WhatsApp.']); }
});
$('#dl').addEventListener('click',()=>{
  if(!pdfOut) return;
  const a=document.createElement('a'); a.href=pdfOut.url; a.download=pdfOut.fileName;
  document.body.appendChild(a); a.click(); a.remove();
});

/* ---------- new report ---------- */
function resetReport(){
  state={name:state.name, date:todayISO(), findings:[blank()], sig:null};
  pdfOut=null; $('#done').hidden=true; clearMsg(); $('#old').hidden=true;
  dateEl.value=state.date; renderList(); sizeSig(); scheduleSave(); window.scrollTo({top:0,behavior:'smooth'});
}
$('#newReport').addEventListener('click',()=>{
  const has=state.findings.some(f=>f.before||f.after||f.breach.trim())||state.sig;
  if(has && !confirm('Start a new report? The current draft will be cleared.')) return;
  resetReport();
});
$('#oldNew').addEventListener('click',resetReport);

/* ---------- boot ---------- */
(async()=>{
  try{
    const d=await idbGet('draft');
    if(d && Array.isArray(d.findings) && d.findings.length){
      state={name:d.name||state.name, date:d.date||todayISO(), findings:d.findings, sig:d.sig||null};
      if(state.date!==todayISO()){
        $('#oldTxt').textContent=`This draft is from ${fmtDate(state.date)}.`;
        $('#old').hidden=false;
      }
    }
  }catch(_){}
  nameEl.value=state.name; dateEl.value=state.date;
  renderList(); sizeSig();
})();

if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
</script>
